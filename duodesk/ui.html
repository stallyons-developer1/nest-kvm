<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoDesk</title>
<style>
  :root{
    --cyan:#34e7df; --cyan-dim:#139f93; --glow:#39f0e6;
    --text:#bfeee9; --muted:#5fa79f; --green:#3fe79a; --amber:#f5b73e; --red:#ff5f6b;
    --fill:linear-gradient(160deg,#0e3330 0%,#0a2220 60%,#081b1a 100%);
    --fill-hi:linear-gradient(160deg,#124a44 0%,#0c2e2b 100%);
    --b16:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
    --b10:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    --b8:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"SF Mono","Menlo","Consolas",monospace;
    color:var(--text); overflow:hidden; user-select:none;
    background:
      radial-gradient(ellipse at 50% 28%, #0b312e 0%, #051716 72%),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(52,231,223,.045) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, rgba(52,231,223,.045) 27px 28px);
    padding:14px;
  }
  .screen{height:calc(100vh - 28px); position:relative; padding:18px 20px 20px;}
  /* beveled neon panel */
  .hud{position:relative;}
  .hud::before{content:"";position:absolute;inset:0;background:var(--cyan);
    clip-path:var(--bev,var(--b16)); filter:drop-shadow(0 0 5px var(--glow)); opacity:.9;}
  .hud::after{content:"";position:absolute;inset:2px;background:var(--fill);
    clip-path:var(--bev,var(--b16));}
  .hud>*{position:relative;z-index:2;}
  .b10{--bev:var(--b10);} .b8{--bev:var(--b8);}
  .hi::after{background:var(--fill-hi);}

  .frame{position:absolute; inset:0; padding:18px 22px;}
  /* header */
  .head{display:flex; align-items:flex-end; justify-content:space-between; padding:6px 6px 14px;}
  .logo{font-size:46px; font-weight:800; letter-spacing:3px; color:var(--cyan);
    text-shadow:0 0 10px var(--glow),0 0 26px rgba(52,231,223,.5); line-height:.9;}
  .tag{margin-top:8px; font-size:11px; letter-spacing:3px; color:var(--muted);}
  .tag b{color:var(--cyan);}
  .hatch{width:120px; height:46px;
    background:repeating-linear-gradient(-55deg, var(--cyan) 0 3px, transparent 3px 11px);
    clip-path:polygon(22% 0,100% 0,100% 100%,0 100%); filter:drop-shadow(0 0 4px var(--glow)); opacity:.8;}

  .section-label{font-size:12px; letter-spacing:4px; color:var(--muted); margin:16px 2px 10px;}
  .section-label .sl{color:var(--cyan); margin-right:8px;}

  /* role rows */
  .role{display:flex; align-items:center; gap:16px; padding:15px 20px; margin-bottom:12px; cursor:pointer;
    font-size:16px; font-weight:700; letter-spacing:2px; color:var(--text);}
  .role .ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--cyan);
    display:grid;place-items:center;box-shadow:0 0 7px rgba(52,231,223,.6);flex:0 0 auto;}
  .role .ring i{width:10px;height:10px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 9px var(--cyan);opacity:0;transition:opacity .12s;}
  .role small{color:var(--cyan); margin-left:auto; letter-spacing:3px;}
  .role.on i{opacity:1;}
  .role:not(.on){--fill:linear-gradient(160deg,#0a2220,#081b1a);}
  .role.on{--fill:var(--fill-hi);}

  .divider{height:2px;margin:14px 4px;background:linear-gradient(90deg,transparent,var(--cyan-dim),transparent);
    box-shadow:0 0 6px rgba(52,231,223,.4);}

  .field{margin:14px 2px;}
  .field .lab{font-size:13px; letter-spacing:3px; color:var(--text); margin-bottom:8px; display:block;}
  .field .lab.m{color:var(--muted); font-size:11px;}
  .row{display:flex; align-items:center; gap:16px;}
  .ip{font-size:26px; font-weight:800; letter-spacing:2px; color:var(--cyan);
    text-shadow:0 0 9px var(--glow); padding:6px 16px; display:inline-block;}

  select,input{
    font-family:inherit; font-size:15px; color:var(--cyan); background:transparent;
    border:none; outline:none; padding:9px 14px; letter-spacing:1px; width:100%;
  }
  .ctrl{display:inline-block;} .ctrl select,.ctrl input{min-width:120px;}
  .ctrl.sm select,.ctrl.sm input{min-width:84px;}
  select{appearance:none; -webkit-appearance:none; cursor:pointer;}
  .ctrl.sel{position:relative;}
  .ctrl.sel::after{content:"\25BE"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color:var(--cyan); pointer-events:none;}

  .opts{display:flex; align-items:center; gap:14px; margin:16px 2px;}
  .opts .lab{font-size:13px;letter-spacing:3px;}

  /* big action button */
  .start{margin:20px 2px 16px; height:66px; display:flex; align-items:center; justify-content:center;
    gap:22px; cursor:pointer; font-size:24px; font-weight:800; letter-spacing:6px; color:var(--cyan);
    text-shadow:0 0 10px var(--glow); transition:filter .12s;}
  .start .sl{width:34px;height:14px;
    background:repeating-linear-gradient(-55deg,var(--cyan) 0 2px,transparent 2px 7px);}
  .start:hover{filter:brightness(1.25);}
  .start.run{--cyan:#ff5f6b; --glow:#ff7b86; --fill:linear-gradient(160deg,#3a1416,#230c0e);}

  .statusrow{display:flex; align-items:center; gap:12px; margin:6px 4px 10px; font-size:13px; letter-spacing:3px;}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);}
  #statustext{color:var(--muted);}

  .log{height:150px; padding:12px 14px !important;}
  .log pre{height:100%; overflow:auto; font-size:11.5px; line-height:1.55; color:var(--text);
    white-space:pre-wrap; letter-spacing:.3px;}
  .log pre::-webkit-scrollbar{width:7px;} .log pre::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:4px;}
</style>
</head>
<body>
  <div class="hud screen">
    <div class="frame">
      <div class="head">
        <div>
          <div class="logo">DUODESK</div>
          <div class="tag">KEYBOARD&nbsp;&nbsp;·&nbsp;&nbsp;MOUSE&nbsp;&nbsp;·&nbsp;&nbsp;CLIPBOARD&nbsp;&nbsp;<b>//</b>&nbsp;&nbsp;2&nbsp;SYSTEMS</div>
        </div>
        <div class="hatch"></div>
      </div>

      <div class="section-label"><span class="sl">///</span>SELECT ROLE</div>

      <div class="hud role on" id="role-server" onclick="setMode('server')">
        <span class="ring"><i></i></span>
        <span>CONTROL THE OTHER SYSTEM</span><small>[ SERVER ]</small>
      </div>
      <div class="hud role" id="role-client" onclick="setMode('client')">
        <span class="ring"><i></i></span>
        <span>BE CONTROLLED BY THE OTHER</span><small>[ CLIENT ]</small>
      </div>

      <div class="divider"></div>

      <!-- server fields -->
      <div id="srv">
        <div class="field row">
          <span class="lab" style="margin:0">OTHER SYSTEM IS ON MY</span>
          <span class="hud b8 ctrl sel"><select id="edge">
            <option value="right">right</option>
            <option value="left">left</option>
          </select></span>
        </div>
        <div class="field">
          <span class="lab m">CLIENT CONNECTS TO THIS IP:</span>
          <span class="hud b8 ip" id="ip">—</span>
        </div>
      </div>

      <!-- client fields -->
      <div id="cli" style="display:none">
        <div class="field">
          <span class="lab">SERVER IP ADDRESS</span>
          <span class="hud b8 ctrl"><input id="host" placeholder="192.168.x.x"></span>
        </div>
      </div>

      <div class="opts">
        <span class="lab">SPEED</span>
        <span class="hud b8 ctrl sm sel"><select id="speed">
          <option>0.25</option><option>0.35</option><option selected>0.5</option>
          <option>0.75</option><option>1.0</option>
        </select></span>
        <span class="lab" style="margin-left:14px">PORT</span>
        <span class="hud b8 ctrl sm"><input id="port" value="24800"></span>
      </div>

      <div class="hud start" id="startbtn" onclick="toggle()">
        <span class="sl"></span><span id="startlabel">START</span><span class="sl"></span>
      </div>

      <div class="statusrow"><span class="dot" id="dot"></span><span id="statustext">IDLE</span></div>

      <div class="hud log"><pre id="log"></pre></div>
    </div>
  </div>

<script>
  var MODE = "server", RUNNING = false;
  var COLORS = {muted:"#5fa79f", cyan:"#34e7df", green:"#3fe79a", amber:"#f5b73e", red:"#ff5f6b"};

  function setMode(m){
    MODE = m;
    document.getElementById("role-server").classList.toggle("on", m==="server");
    document.getElementById("role-client").classList.toggle("on", m==="client");
    document.getElementById("srv").style.display = m==="server" ? "" : "none";
    document.getElementById("cli").style.display = m==="client" ? "" : "none";
  }

  function toggle(){
    if (RUNNING){ window.pywebview.api.stop(); return; }
    var payload = {
      mode: MODE,
      edge: document.getElementById("edge").value,
      host: document.getElementById("host").value,
      port: document.getElementById("port").value,
      speed: document.getElementById("speed").value
    };
    window.pywebview.api.start(payload);
  }

  // called from Python
  window.duodesk = {
    log: function(msg){
      var el = document.getElementById("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    },
    status: function(text, color){
      document.getElementById("statustext").textContent = text.toUpperCase();
      var c = COLORS[color] || COLORS.muted;
      var dot = document.getElementById("dot");
      dot.style.background = c; dot.style.boxShadow = "0 0 9px " + c;
    },
    running: function(on){
      RUNNING = on;
      var b = document.getElementById("startbtn");
      b.classList.toggle("run", on);
      document.getElementById("startlabel").textContent = on ? "STOP" : "START";
    },
    setip: function(ip){ document.getElementById("ip").textContent = ip; }
  };

  window.addEventListener("pywebviewready", function(){
    window.pywebview.api.get_ip().then(function(ip){ window.duodesk.setip(ip); });
  });
</script>
</body>
</html>
