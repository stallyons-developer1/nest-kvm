<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DuoDesk</title>
<style>
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-Regular.ttf');font-weight:400;font-display:block;}
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-SemiBold.ttf');font-weight:600;font-display:block;}
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-Bold.ttf');font-weight:700;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#06201f;}
  #app{position:relative;width:560px;height:702px;margin:0 auto;
    background:url('bg.png') no-repeat center/100% 100%;
    font-family:'Chakra Petch',monospace;color:#34e7df;user-select:none;}
  .hit{position:absolute;cursor:pointer;z-index:5;}
  .bev8{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);}
  /* role state overlays */
  .roverlay{position:absolute;left:35px;width:490px;pointer-events:none;z-index:2;display:none;}
  #dim-server{top:160px;height:40px;background:rgba(4,15,14,.62);}
  #hi-client{top:201px;height:37px;background:linear-gradient(165deg,rgba(52,231,223,.18),rgba(52,231,223,.04));
    box-shadow:inset 0 0 18px rgba(52,231,223,.25);}
  .dot{position:absolute;width:15px;height:15px;border-radius:50%;background:#34e7df;
    box-shadow:0 0 11px #34e7df;transform:translate(-50%,-50%);transition:top .12s;z-index:4;}
  /* live values */
  .val{position:absolute;display:flex;align-items:center;font-weight:600;letter-spacing:1px;color:#34e7df;
    pointer-events:none;z-index:3;}
  select,input{position:absolute;background:transparent;border:none;outline:none;color:#34e7df;
    font-family:inherit;font-weight:600;letter-spacing:1px;-webkit-appearance:none;appearance:none;z-index:3;}
  select{cursor:pointer;} input{cursor:text;color:#cdeee9;} input::placeholder{color:#5fa79f;}
  #startlabel{position:absolute;text-align:center;font-weight:700;letter-spacing:5px;color:#34e7df;
    text-shadow:0 0 9px #39f0e6;pointer-events:none;z-index:3;}
  #start-red{position:absolute;left:42px;top:421px;width:476px;height:56px;
    background:rgba(255,70,80,.16);box-shadow:inset 0 0 22px rgba(255,70,80,.3);display:none;pointer-events:none;z-index:2;}
  #sdot{position:absolute;width:13px;height:13px;border-radius:50%;background:#3fe79a;
    box-shadow:0 0 9px #3fe79a;transform:translate(-50%,-50%);z-index:3;}
  #status{position:absolute;font-weight:600;font-size:15px;letter-spacing:2px;color:#5fa79f;pointer-events:none;z-index:3;}
  #log{position:absolute;overflow:auto;font-weight:500;font-size:11px;line-height:1.5;
    white-space:pre-wrap;color:#bfeee9;letter-spacing:.3px;z-index:3;}
  #log::-webkit-scrollbar{width:6px;} #log::-webkit-scrollbar-thumb{background:#139f93;border-radius:3px;}
</style>
</head>
<body>
  <div id="app">
    <div class="hit" style="left:7px;top:5px;width:26px;height:26px;border-radius:50%" onclick="window.pywebview.api.close()"></div>

    <!-- role state overlays (on the baked image) -->
    <div class="roverlay bev8" id="dim-server"></div>
    <div class="roverlay bev8" id="hi-client"></div>

    <!-- role hit areas + selection dot -->
    <div class="hit" style="left:35px;top:160px;width:490px;height:40px" onclick="setMode('server')"></div>
    <div class="hit" style="left:35px;top:201px;width:490px;height:37px" onclick="setMode('client')"></div>
    <div class="dot" id="dot" style="left:61px;top:180px"></div>

    <select id="edge" style="left:252px;top:265px;width:106px;height:26px;font-size:17px;padding-left:10px">
      <option value="right">right</option><option value="left">left</option>
    </select>

    <div class="val" id="ip" style="left:67px;top:325px;width:220px;height:30px;font-size:22px;font-weight:700"></div>
    <input id="host" placeholder="server IP" style="left:66px;top:326px;width:224px;height:26px;font-size:18px;display:none">

    <select id="speed" style="left:108px;top:366px;width:120px;height:26px;font-size:17px;padding-left:10px">
      <option>0.25</option><option>0.35</option><option selected>0.5</option><option>0.75</option><option>1.0</option>
    </select>
    <input id="port" value="24800" style="left:322px;top:366px;width:112px;height:26px;font-size:17px;padding-left:10px">

    <div id="start-red"></div>
    <div class="hit" style="left:42px;top:421px;width:476px;height:56px" onclick="toggle()"></div>
    <div id="startlabel" style="left:42px;top:436px;width:476px;font-size:30px">START</div>

    <div id="sdot" style="left:43px;top:518px"></div>
    <div id="status" style="left:58px;top:510px">IDLE</div>
    <div id="log" style="left:50px;top:549px;width:460px;height:112px"></div>
  </div>

<script>
  var MODE="server",RUNNING=false;
  var C={muted:"#5fa79f",cyan:"#34e7df",green:"#3fe79a",amber:"#f5b73e",red:"#ff5f6b"};
  var $=function(i){return document.getElementById(i);};

  function setMode(m){
    MODE=m;
    var sv=m==="server";
    $("dot").style.top = sv?"180px":"219px";
    $("dim-server").style.display = sv?"none":"block";   // knock down baked server highlight
    $("hi-client").style.display  = sv?"none":"block";   // light up client row
    $("ip").style.display   = sv?"flex":"none";
    $("edge").style.display = sv?"block":"none";
    $("host").style.display = sv?"none":"block";
  }
  function toggle(){
    if(RUNNING){window.pywebview.api.stop();return;}
    window.pywebview.api.start({mode:MODE,edge:$("edge").value,host:$("host").value,port:$("port").value,speed:$("speed").value});
  }
  window.duodesk={
    log:function(msg){var e=$("log");e.textContent+=msg+"\n";e.scrollTop=e.scrollHeight;},
    status:function(t,c){$("status").textContent=t.toUpperCase();var col=C[c]||C.muted;
      $("status").style.color=col;var d=$("sdot");d.style.background=col;d.style.boxShadow="0 0 9px "+col;},
    running:function(on){RUNNING=on;
      $("startlabel").textContent=on?"STOP":"START";
      $("startlabel").style.color=on?C.red:C.cyan;
      $("startlabel").style.textShadow="0 0 9px "+(on?"#ff8089":"#39f0e6");
      $("start-red").style.display=on?"block":"none";},
    setip:function(ip){$("ip").textContent=ip;}
  };
  document.addEventListener("keydown",function(e){if(e.key==="Escape")window.pywebview.api.close();});
  function fetchIP(n){
    if(window.pywebview&&window.pywebview.api&&window.pywebview.api.get_ip){
      window.pywebview.api.get_ip().then(function(ip){window.duodesk.setip(ip);})
        .catch(function(){if(n>0)setTimeout(function(){fetchIP(n-1);},200);});
    }else if(n>0){setTimeout(function(){fetchIP(n-1);},200);}
  }
  window.addEventListener("pywebviewready",function(){fetchIP(25);});
  fetchIP(40);
</script>
</body>
</html>
