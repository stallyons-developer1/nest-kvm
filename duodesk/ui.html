<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DuoDesk</title>
<style>
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-Regular.ttf');font-weight:400;font-display:block;}
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-SemiBold.ttf');font-weight:600;font-display:block;}
  @font-face{font-family:'Chakra Petch';src:url('fonts/ChakraPetch-Bold.ttf');font-weight:700;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#06201f;}
  #app{position:relative;width:560px;height:702px;margin:0 auto;
    background:url('bg.png') no-repeat center/100% 100%;
    font-family:'Chakra Petch',monospace;color:#34e7df;user-select:none;}
  .hit{position:absolute;cursor:pointer;}
  .cyan{color:#34e7df;}
  .val{position:absolute;display:flex;align-items:center;font-weight:600;letter-spacing:1px;
    color:#34e7df;pointer-events:none;}
  select,input{position:absolute;background:transparent;border:none;outline:none;
    color:#34e7df;font-family:inherit;font-weight:600;letter-spacing:1px;
    -webkit-appearance:none;appearance:none;cursor:pointer;}
  input{cursor:text;}
  .dot{position:absolute;width:15px;height:15px;border-radius:50%;background:#34e7df;
    box-shadow:0 0 11px #34e7df;transform:translate(-50%,-50%);transition:top .12s;}
  #startlabel{position:absolute;text-align:center;font-weight:700;letter-spacing:5px;
    text-shadow:0 0 9px #39f0e6;pointer-events:none;color:#34e7df;}
  #sdot{position:absolute;width:13px;height:13px;border-radius:50%;background:#3fe79a;
    box-shadow:0 0 9px #3fe79a;transform:translate(-50%,-50%);}
  #status{position:absolute;font-weight:600;font-size:15px;letter-spacing:2px;color:#5fa79f;pointer-events:none;}
  #log{position:absolute;overflow:auto;font-weight:500;font-size:11px;line-height:1.5;
    white-space:pre-wrap;color:#bfeee9;letter-spacing:.3px;}
  #log::-webkit-scrollbar{width:6px;} #log::-webkit-scrollbar-thumb{background:#139f93;border-radius:3px;}
</style>
</head>
<body>
  <div id="app">
    <!-- window close (over the red traffic light) -->
    <div class="hit" style="left:9px;top:6px;width:16px;height:16px;border-radius:50%" onclick="window.pywebview.api.close()"></div>

    <!-- role selection -->
    <div class="hit" style="left:35px;top:160px;width:490px;height:40px" onclick="setMode('server')"></div>
    <div class="hit" style="left:35px;top:201px;width:490px;height:36px" onclick="setMode('client')"></div>
    <div class="dot" id="dot" style="left:61px;top:180px"></div>

    <!-- server: edge -->
    <select id="edge" style="left:252px;top:264px;width:108px;height:28px;font-size:17px;padding-left:10px">
      <option value="right">right</option>
      <option value="left">left</option>
    </select>

    <!-- IP bracket: server shows own IP, client types server IP -->
    <div class="val" id="ip" style="left:68px;top:324px;width:210px;height:30px;font-size:22px;font-weight:700"></div>
    <input id="host" placeholder="server IP" style="left:66px;top:325px;width:220px;height:28px;font-size:18px;display:none">

    <!-- speed + port -->
    <select id="speed" style="left:108px;top:365px;width:122px;height:28px;font-size:17px;padding-left:10px">
      <option>0.25</option><option>0.35</option><option selected>0.5</option><option>0.75</option><option>1.0</option>
    </select>
    <input id="port" value="24800" style="left:322px;top:365px;width:112px;height:28px;font-size:17px;padding-left:10px">

    <!-- start -->
    <div class="hit" style="left:42px;top:421px;width:476px;height:56px" onclick="toggle()"></div>
    <div id="startlabel" style="left:42px;top:436px;width:476px;font-size:30px">START</div>

    <!-- status + log -->
    <div id="sdot" style="left:43px;top:517px"></div>
    <div id="status" style="left:58px;top:509px">IDLE</div>
    <div id="log" style="left:49px;top:548px;width:462px;height:112px"></div>
  </div>

<script>
  var MODE="server", RUNNING=false;
  var C={muted:"#5fa79f",cyan:"#34e7df",green:"#3fe79a",amber:"#f5b73e",red:"#ff5f6b"};
  var $=function(id){return document.getElementById(id);};

  function setMode(m){
    MODE=m;
    $("dot").style.top = (m==="server"?"180px":"219px");
    $("ip").style.display   = m==="server"?"flex":"none";
    $("edge").style.display = m==="server"?"block":"none";
    $("host").style.display = m==="client"?"block":"none";
  }

  function toggle(){
    if(RUNNING){ window.pywebview.api.stop(); return; }
    window.pywebview.api.start({
      mode:MODE, edge:$("edge").value, host:$("host").value,
      port:$("port").value, speed:$("speed").value
    });
  }

  window.duodesk={
    log:function(msg){var e=$("log");e.textContent+=msg+"\n";e.scrollTop=e.scrollHeight;},
    status:function(t,c){$("status").textContent=t.toUpperCase();
      var col=C[c]||C.muted; $("status").style.color=col;
      var d=$("sdot"); d.style.background=col; d.style.boxShadow="0 0 9px "+col;},
    running:function(on){RUNNING=on;
      $("startlabel").textContent=on?"STOP":"START";
      $("startlabel").style.color=on?C.red:C.cyan;
      $("startlabel").style.textShadow="0 0 9px "+(on?"#ff7b86":"#39f0e6");},
    setip:function(ip){$("ip").textContent=ip;}
  };

  window.addEventListener("pywebviewready",function(){
    if(window.pywebview&&window.pywebview.api&&window.pywebview.api.get_ip)
      window.pywebview.api.get_ip().then(function(ip){window.duodesk.setip(ip);});
  });
</script>
</body>
</html>
